exclude: ^extension/thirdparty/

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        files: ^extension/(src|include|godot|tests)/.*\.(cpp|hpp|h)$|^extension/register_types\.(cpp|h)$

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        args: [--line-length=120]
        files: ^(extension/(.*\.py|SConstruct|SCsub|config\.py)|ci/.*\.py)$
