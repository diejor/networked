name: Deploy Bomber Discord Activity

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: discord-activity
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: "Resolve the source run"
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.source.outputs.run-id }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resolve-ci-run
        id: source

  export:
    name: "Export Web"
    needs: resolve
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout The Resolved Revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/export-web-demo
        with:
          scene: uid://3a3852p4fypv
          out: build/web
          run-id: ${{ needs.resolve.outputs.run-id }}
          expect-sha: ${{ needs.resolve.outputs.sha }}
          record: build/web-export.json

      - name: Compress wasm (Brotli) and write Cloudflare headers
        run: |
          set -eu
          apt-get update && apt-get install -y --no-install-recommends brotli
          python3 ci/export.py cloudflare --dir build/web
          ls -l build/web

      - name: Stage The Page
        uses: actions/upload-artifact@v4
        with:
          name: activity-web
          path: build/web
          retention-days: 1

  deploy:
    name: "Deploy to Cloudflare"
    needs: [resolve, export]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout The Resolved Revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Collect The Staged Page
        uses: actions/download-artifact@v4
        with:
          name: activity-web
          path: build/web

      - name: Deploy page to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ vars.CF_PAGES_PROJECT }}

      - name: Deploy token Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: addons/networked_activity/templates/token_worker
          command: deploy
