name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag and publish, such as 0.3. Empty builds a candidate without publishing it.
        type: string
        required: false
        default: ""
      profile:
        description: Profile to build the candidate from.
        type: string
        required: false
        default: release
      unqualified:
        description: Platforms this candidate cannot qualify, recorded in the manifest.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: "Verification"
    uses: ./.github/workflows/static-checks.yml

  candidate:
    name: "Candidate"
    uses: ./.github/workflows/gdextension.yml
    with:
      profile: ${{ inputs.profile || 'release' }}
      package: true
      unqualified: ${{ inputs.unqualified || '' }}

  inventory:
    name: "Inventory gate"
    needs: [verify, candidate]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      publishable: ${{ steps.gate.outputs.publishable }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download The Candidate
        uses: actions/download-artifact@v4
        with:
          name: networked-addon
          path: dist

      - name: Hold The Candidate To Its Profile
        id: gate
        shell: bash
        env:
          PROFILE: ${{ inputs.profile || 'release' }}
          VERSION: ${{ inputs.version || '' }}
        run: |
          set -eu
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$VERSION" ]; then
            tag="v${VERSION#v}"
          else
            tag=""
          fi
          python3 ci/release.py \
            --profile "$PROFILE" \
            --tag "$tag" \
            --sha "$GITHUB_SHA" \
            --record dist/inventory.json
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install The Engine
        id: engine
        shell: bash
        run: python3 ci/engine.py install

      - name: Load The Archive In A Clean Consumer
        shell: bash
        run: |
          set -eu
          core="$(find dist -maxdepth 1 -name 'networked-*.zip' -print -quit)"
          steam="$(find dist -maxdepth 1 -name 'networked_steam-*.zip' -print -quit)"
          test -n "$core"
          test -n "$steam"
          python3 ci/test.py --godot "${{ steps.engine.outputs.binary }}" \
            consumer --zip "$core" --zip "$steam"

      - name: Upload The Inventory
        uses: actions/upload-artifact@v4
        with:
          name: release-inventory
          path: dist/inventory.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: "Publish"
    needs: inventory
    if: needs.inventory.outputs.publishable == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ needs.inventory.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download The Candidate
        uses: actions/download-artifact@v4
        with:
          name: networked-addon
          path: dist

      - name: Hold The Candidate To Its Profile Again
        shell: bash
        run: |
          set -eu
          python3 ci/release.py \
            --tag "$TAG" \
            --sha "$GITHUB_SHA" \
            --publish

      - name: Tag The Commit
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG;
            const ref = `tags/${tag}`;
            try {
              const found = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              let commit = found.data.object.sha;
              if (found.data.object.type === 'tag') {
                commit = (await github.rest.git.getTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_sha: commit,
                })).data.object.sha;
              }
              if (commit !== context.sha) {
                throw new Error(
                  `${tag} already points at ${commit.slice(0, 12)}, not ${context.sha.slice(0, 12)}`);
              }
              core.info(`${tag} already points at this commit`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${ref}`,
                sha: context.sha,
              });
              core.info(`created ${tag} at ${context.sha.slice(0, 12)}`);
            }

      - name: Stage A Draft And Upload Every Asset
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.TAG;
            const files = fs.readdirSync('dist')
              .filter(name => name !== 'inventory.json')
              .map(name => path.join('dist', name));
            if (files.length === 0) {
              throw new Error('the candidate carries no assets to publish');
            }
            let release;
            const existing = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            release = existing.data.find(entry => entry.tag_name === tag);
            if (release && !release.draft) {
              throw new Error(`${tag} is already published; a corrected build needs a new version`);
            }
            if (!release) {
              // A squashed landing leaves earlier tags off main, so GitHub's
              // own guess at the previous release can skip several of them.
              const previous = existing.data.find(entry => !entry.draft && entry.tag_name !== tag);
              const notes = (await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                ...(previous ? { previous_tag_name: previous.tag_name } : {}),
              })).data.body;
              const readme = name =>
                `[\`${name}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${tag}/addons/${name}/README.md)`;
              release = (await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                draft: true,
                body: [
                  "Unzip `networked` into your project's root. The other zips are optional integrations that unzip beside it.",
                  "",
                  `- ${readme("networked_steam")} adds Steam. GodotSteam is included.`,
                  `- ${readme("networked_discord")} adds Discord. Get Discord's own library from its developer portal.`,
                  `- ${readme("networked_nakama")} adds Nakama. The Nakama Godot client is included.`,
                  "",
                  notes,
                ].join("\n"),
              })).data;
            }
            const present = new Set(
              (await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                per_page: 100,
              })).data.map(asset => asset.name)
            );
            for (const file of files) {
              const name = path.basename(file);
              if (present.has(name)) {
                core.info(`${name} is already uploaded; a retry does not replace it`);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(file),
              });
              core.info(`uploaded ${name}`);
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
            });
            core.info(`published ${tag}`);
