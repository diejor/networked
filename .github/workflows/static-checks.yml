name: Static Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: "Format check"
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  gdscript:
    name: "GDScript format + lint"
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GDFORMAT_VERSION: "0.20.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install gdscript-formatter
        run: |
          set -eu
          base="https://github.com/GDQuest/GDScript-formatter/releases/download"
          asset="gdscript-formatter-${GDFORMAT_VERSION}-linux-x86_64"
          curl -sSL "${base}/${GDFORMAT_VERSION}/${asset}.zip" -o gdf.zip
          unzip -o gdf.zip -d gdf
          install -Dm755 "gdf/${asset}" "$HOME/.local/bin/gdscript-formatter"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: gdscript-formatter --check addons/networked tests examples

      - name: Lint
        continue-on-error: true
        run: |
          gdscript-formatter lint --pretty \
            --max-line-length 100 \
            --disable private-access,signal-name \
            addons/networked tests examples

  workflows:
    name: "Workflow and shell lint"
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Pinned Linters
        shell: bash
        run: |
          set -eu
          python3 ci/bootstrap.py tools actionlint shellcheck
          echo "$PWD/ci/.tools" >> "$GITHUB_PATH"

      - name: Lint Workflows
        shell: bash
        run: actionlint -color

      - name: Lint Shell Scripts
        shell: bash
        run: shellcheck --shell=sh extension/tools/setup_godot.sh

  laws:
    name: "Tree laws"
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check No File Gained A Comment
        run: python extension/tools/check_no_comments.py --ratchet

      - name: Prove The Comment Ratchet Refuses
        run: python extension/tools/check_no_comments.py --self-test

      - name: Prove The Wire Decoder Refuses
        run: python extension/tools/wire_decode.py --self-test

  pipeline:
    name: "Pipeline fixtures"
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove The Report Reader Refuses
        run: python ci/reports.py --self-test

      - name: Run The Pipeline Fixtures
        run: python -m unittest discover -s ci/tests -t . -v
