name: Module

on:
  workflow_call:
    inputs:
      profiler:
        description: Engine profiler backend, `tracy` or `none`.
        type: string
        required: false
        default: none
      engine:
        description: Entry in ci/engines.json to build.
        type: string
        required: false
        default: normal
  workflow_dispatch:
    inputs:
      profiler:
        description: Engine profiler backend, `tracy` or `none`.
        type: string
        required: false
        default: none
      engine:
        description: Entry in ci/engines.json to build.
        type: string
        required: false
        default: normal

permissions:
  contents: read

concurrency:
  group: module-${{ github.event.number || github.ref_name }}-${{ inputs.engine || 'normal' }}
  cancel-in-progress: true

jobs:
  test:
    name: "Engine module (${{ inputs.engine || 'normal' }}, profiler=${{ inputs.profiler || 'none' }})"
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Dependency Pins
        id: pins
        shell: bash
        run: |
          set -eu
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys

          sys.path.insert(0, "ci")
          from common import read_pins

          for key, value in read_pins().items():
              print("%s=%s" % (key, value))
          PY

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        shell: bash
        run: pip install "scons==${{ steps.pins.outputs.SCONS_VERSION }}"

      - name: Install Engine Build Dependencies
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev \
            libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev

      - name: Checkout And Mount Engine
        shell: bash
        env:
          NETW_ENGINE: ${{ inputs.engine || 'normal' }}
        run: extension/tools/setup_godot.sh

      - name: Checkout Tracy
        if: ${{ (inputs.profiler || 'none') == 'tracy' }}
        shell: bash
        run: |
          set -eu
          git clone --depth 1 \
            --branch "${{ steps.pins.outputs.TRACY_REF }}" \
            https://github.com/wolfpld/tracy.git \
            extension/thirdparty/tracy

      - name: Cache SCons Objects
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: >-
            module-scons-${{ runner.os }}-${{ inputs.engine || 'normal' }}-${{
              inputs.profiler || 'none' }}-${{
              hashFiles('extension/deps.env', 'ci/engines.json') }}-${{
              github.sha }}
          restore-keys: >-
            module-scons-${{ runner.os }}-${{ inputs.engine || 'normal' }}-${{
              inputs.profiler || 'none' }}-${{
              hashFiles('extension/deps.env', 'ci/engines.json') }}-

      - name: Build Engine With The Module
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
          PROFILER: ${{ inputs.profiler || 'none' }}
        run: |
          set -eu
          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
          args=(target=editor tests=yes progress=no)
          if [ "$PROFILER" = "tracy" ]; then
            args+=(profiler=tracy)
            args+=("profiler_path=$PWD/extension/thirdparty/tracy")
          fi
          scons -C extension/thirdparty/godot -j"$jobs" "${args[@]}"

      - name: Verify The Module Was Built In
        shell: bash
        run: |
          set -eu
          grep -q 'MODULE_NETWORKED_ENABLED' \
            extension/thirdparty/godot/modules/modules_enabled.gen.h
          grep -q 'test_networked_module.h' \
            extension/thirdparty/godot/modules/modules_tests.gen.h

      - name: Run The Module Tests
        shell: bash
        run: python3 ci/test.py module
