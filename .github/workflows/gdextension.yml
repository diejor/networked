name: GDExtension

on:
  workflow_call:
    inputs:
      profile:
        description: Profile from ci/platforms.json.
        type: string
        required: false
        default: pr
      cells:
        description: Explicit cell ids, overriding the profile.
        type: string
        required: false
        default: ""
      package:
        description: Assemble the addon zip from the built cells.
        type: boolean
        required: false
        default: true
      unqualified:
        description: Platforms this run cannot qualify, recorded in the manifest.
        type: string
        required: false
        default: ""
    outputs:
      cells:
        description: The cells this run resolved.
        value: ${{ jobs.prepare.outputs.cells }}
  workflow_dispatch:
    inputs:
      profile:
        description: Profile from ci/platforms.json.
        type: string
        required: false
        default: pr
      cells:
        description: Explicit cell ids, overriding the profile.
        type: string
        required: false
        default: ""
      package:
        description: Assemble the addon zip from the built cells.
        type: boolean
        required: false
        default: true
      unqualified:
        description: Platforms this run cannot qualify, recorded in the manifest.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    name: "Resolve matrix"
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
      ids: ${{ steps.cells.outputs.ids }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Cells
        id: cells
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          CELLS: ${{ inputs.cells }}
        run: |
          set -eu
          if [ -n "$CELLS" ]; then
            python3 ci/matrix.py --cells "$CELLS" --format github
            echo "ids=$CELLS" >> "$GITHUB_OUTPUT"
          else
            python3 ci/matrix.py --profile "$PROFILE" --format github
            ids="$(python3 ci/matrix.py --profile "$PROFILE" --format ids | paste -sd,)"
            echo "ids=$ids" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: "${{ matrix.cell.id }}"
    needs: prepare
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.prepare.outputs.cells) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/build-native
        with:
          cell: ${{ matrix.cell.id }}
          platform: ${{ matrix.cell.platform }}
          suffix: ${{ matrix.cell.suffix }}
          strip: "true"
          require-fresh: "true"

      - name: Upload Staged Cell
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cell.artifact }}
          path: dist/cells/${{ matrix.cell.artifact }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: "Addon zip"
    needs: [prepare, build]
    if: ${{ inputs.package != false && inputs.package != 'false' }}
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Staged Cells
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/cells

      - name: Assemble The Addon
        shell: bash
        env:
          IDS: ${{ needs.prepare.outputs.ids }}
          UNQUALIFIED: ${{ inputs.unqualified }}
        run: |
          set -eu
          python3 ci/package.py \
            --cells "$IDS" \
            --expect-sha "$GITHUB_SHA" \
            --unqualified "$UNQUALIFIED"

      - name: Upload Addon Zip
        uses: actions/upload-artifact@v4
        with:
          name: networked-addon
          path: |
            dist/*.zip
            dist/*.manifest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
