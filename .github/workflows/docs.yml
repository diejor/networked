name: Docs build verification

on:
  push:
    branches: [main, total-native]
    paths:
      - "addons/networked/**/*.gd"
      - "extension/**"
      - "ci/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/build-docs-classes/**"
      - ".readthedocs.yml"
  pull_request:
    branches: [main, total-native]
    paths:
      - "addons/networked/**/*.gd"
      - "extension/**"
      - "ci/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/build-docs-classes/**"
      - ".readthedocs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: "Docs build"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-docs-classes

      - name: Cache Sphinx doctrees
        uses: actions/cache@v4
        with:
          path: docs/_build/doctrees
          key: sphinx-doctrees-html-${{ hashFiles('docs/**/*.rst', 'docs/**/*.py', 'docs/conf.py') }}
          restore-keys: |
            sphinx-doctrees-html-

      - name: Build HTML with Sphinx
        working-directory: docs
        run: python -m sphinx -T --keep-going -b html -d _build/doctrees . _build/html

      - name: Upload built docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
