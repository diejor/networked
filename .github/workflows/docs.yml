name: Docs build verification

on:
  push:
    branches: [main, total-native]
    paths:
      - "addons/networked/**/*.gd"
      - "extension/**"
      - "ci/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/build-docs-classes/**"
      - ".readthedocs.yml"
  pull_request:
    branches: [main, total-native]
    paths:
      - "addons/networked/**/*.gd"
      - "extension/**"
      - "ci/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/build-docs-classes/**"
      - ".readthedocs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: "Docs build"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-docs-classes

      - name: Check The Committed Class Reference
        shell: bash
        run: |
          set -eu
          drift="$(git status --porcelain -- docs/classes)"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            git diff --stat -- docs/classes
            echo "::error::docs/classes is stale, and Read the Docs publishes it as committed."
            echo "::error::Regenerate it from a netw_tests=yes build with the engine in ci/engines.json:"
            echo "::error::  python3 docs/tools/build_reference.py --godot <godot>"
            echo "::error::then commit docs/classes."
            exit 1
          fi

      - name: Cache Sphinx doctrees
        uses: actions/cache@v4
        with:
          path: docs/_build/doctrees
          key: sphinx-doctrees-html-${{ hashFiles('docs/**/*.rst', 'docs/**/*.py', 'docs/conf.py') }}
          restore-keys: |
            sphinx-doctrees-html-

      - name: Build HTML with Sphinx
        working-directory: docs
        run: python -m sphinx -T --keep-going -b html -d _build/doctrees . _build/html

      - name: Upload built docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
