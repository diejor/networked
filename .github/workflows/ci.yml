name: CI
run-name: ${{ github.head_ref || github.ref_name }} - CI Test Run

on:
  push:
    branches:
      - main
      - total-native
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
      - total-native
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      profile:
        description: Library profile from ci/platforms.json.
        type: string
        required: false
        default: pr

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: "Lanes"
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.lanes.outputs.native }}
      hosted: ${{ steps.lanes.outputs.hosted }}
      module: ${{ steps.lanes.outputs.module }}
      gdscript: ${{ steps.lanes.outputs.gdscript }}
      examples: ${{ steps.lanes.outputs.examples }}
      docs: ${{ steps.lanes.outputs.docs }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Lanes
        id: lanes
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          resolved="${BASE:-}"
          if [ "$resolved" = "0000000000000000000000000000000000000000" ]; then
            resolved=""
          fi
          if [ -n "$resolved" ] && ! git cat-file -e "$resolved^{commit}" 2>/dev/null; then
            resolved=""
          fi
          python3 ci/changed.py --base "$resolved"

  checks:
    name: "Static checks"
    uses: ./.github/workflows/static-checks.yml

  native:
    name: "Native"
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/gdextension.yml
    with:
      profile: ${{ inputs.profile || 'pr' }}

  hosted:
    name: "Embedded Suite (${{ matrix.engine }})"
    needs: changes
    if: needs.changes.outputs.hosted == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [normal, stepping]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/build-native
        with:
          cell: linux:x86_64:template_debug
          platform: linux
          suffix: .linux.template_debug.x86_64
          scons-args: netw_tests=yes

      - name: Install The Engine
        id: engine
        shell: bash
        run: python3 ci/engine.py --engine ${{ matrix.engine }} install

      - name: Import The Project
        shell: bash
        run: python3 ci/test.py --godot "${{ steps.engine.outputs.binary }}" import

      - name: Run The Embedded Suite
        shell: bash
        run: python3 ci/test.py --godot "${{ steps.engine.outputs.binary }}" native

      - name: Hold The Descriptors To The Prose
        if: always()
        shell: bash
        run: |
          set -eu
          test -s reports/native/wire.spec.json
          python3 extension/tools/wire_decode.py --self-test \
            --spec reports/native/wire.spec.json

      - name: Read The Report
        if: always()
        shell: bash
        run: |
          python3 ci/reports.py reports/native/results.xml \
            --floor tests/native/hosted_floor.txt

      - name: Upload The Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-${{ matrix.engine }}
          path: |
            reports/native
            tmp/native.log
          if-no-files-found: warn
          retention-days: 7

  module:
    name: "Engine Module"
    needs: changes
    if: needs.changes.outputs.module == 'true'
    uses: ./.github/workflows/module.yml
    with:
      profiler: none

  doc-drift:
    name: "Doc Drift"
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.native == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/build-native
        with:
          cell: linux:x86_64:template_debug
          platform: linux
          suffix: .linux.template_debug.x86_64

      - name: Install The Engine
        id: engine
        shell: bash
        run: python3 ci/engine.py install

      - name: Import The Project
        shell: bash
        run: python3 ci/test.py --godot "${{ steps.engine.outputs.binary }}" import

      - name: Regenerate The Class Reference
        shell: bash
        env:
          GODOT: ${{ steps.engine.outputs.binary }}
        run: |
          set -eu
          "$GODOT" --doctool extension --gdextension-docs \
            --headless --path . --quit
          sed -n 's/.*GDREGISTER_[A-Z_]*CLASS(netw::\([A-Za-z0-9_]*\)).*/\1.xml/p' \
            extension/register_types.cpp | sort > /tmp/netw-registered.txt
          find extension/doc_classes -maxdepth 1 -name '*.xml' -printf '%f\n' \
            | sort > /tmp/netw-emitted.txt
          comm -13 /tmp/netw-registered.txt /tmp/netw-emitted.txt \
            | while read -r name; do rm -f "extension/doc_classes/$name"; done

      - name: Check class reference drift
        shell: bash
        run: |
          set -eu
          drift="$(git status --porcelain -- extension/doc_classes)"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            git diff -- extension/doc_classes
            echo "::error::extension/doc_classes is stale. Regenerate with:"
            echo "::error::  godot --doctool extension --gdextension-docs --headless --path . --quit"
            echo "::error::then drop the other extensions' files, which are not ours to carry."
            echo "::error::Regenerate from a build WITHOUT netw_tests: that flag registers"
            echo "::error::NetwNativeTests, which is not part of the shipping reference."
            exit 1
          fi
          test "$(find extension/doc_classes -maxdepth 1 -name 'Netw*.xml' | wc -l)" -gt 0

  gdscript-tests:
    name: "GdUnit4 res://tests"
    needs: changes
    if: needs.changes.outputs.gdscript == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/build-native
        with:
          cell: linux:x86_64:template_debug
          platform: linux
          suffix: .linux.template_debug.x86_64
          scons-args: netw_tests=yes

      - name: Install The Engine
        id: engine
        shell: bash
        run: python3 ci/engine.py install

      - name: Import The Project
        shell: bash
        run: python3 ci/test.py --godot "${{ steps.engine.outputs.binary }}" import

      - name: Parse Every Script
        shell: bash
        run: |
          python3 ci/test.py --godot "${{ steps.engine.outputs.binary }}" \
            parse res://tests res://addons/networked

      - name: Run The Suites
        shell: bash
        run: |
          python3 ci/test.py --godot "${{ steps.engine.outputs.binary }}" \
            gdunit --name tests --path res://tests/

      - name: Read The Report
        if: always()
        shell: bash
        run: |
          python3 ci/reports.py reports/tests/report_1 \
            --log tmp/gdunit-tests.log --allow-stale

      - name: Upload The Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-tests
          path: |
            reports/tests
            tmp/gdunit-tests.log
          if-no-files-found: warn
          retention-days: 7

  gdscript-examples:
    name: "GdUnit4 res://examples"
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/build-native
        with:
          cell: linux:x86_64:template_debug
          platform: linux
          suffix: .linux.template_debug.x86_64
          scons-args: netw_tests=yes

      - name: Install The Engine
        id: engine
        shell: bash
        run: python3 ci/engine.py install

      - name: Import The Project
        shell: bash
        run: python3 ci/test.py --godot "${{ steps.engine.outputs.binary }}" import

      - name: Run The Suites
        shell: bash
        run: |
          python3 ci/test.py --godot "${{ steps.engine.outputs.binary }}" \
            gdunit --name examples --path res://examples/

      - name: Read The Report
        if: always()
        shell: bash
        run: |
          python3 ci/reports.py reports/examples/report_1 \
            --log tmp/gdunit-examples.log --allow-stale

      - name: Upload The Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-examples
          path: |
            reports/examples
            tmp/gdunit-examples.log
          if-no-files-found: warn
          retention-days: 7

  verified:
    name: "Verified"
    if: always()
    needs:
      - checks
      - native
      - hosted
      - module
      - doc-drift
      - gdscript-tests
      - gdscript-examples
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -eu
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          for name, entry in sorted(results.items()):
              print("%-20s %s" % (name, entry["result"]))
          failed = [
              name
              for name, entry in results.items()
              if entry["result"] not in ("success", "skipped")
          ]
          if failed:
              sys.exit("failed jobs: %s" % ", ".join(sorted(failed)))
          PY
