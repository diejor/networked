name: GDScript Style

on:
  push:
    branches: [main]
    paths:
      - "addons/networked/**/*.gd"
      - "tests/**/*.gd"
      - ".github/workflows/gdscript-style.yml"
  pull_request:
    branches: [main]
    paths:
      - "addons/networked/**/*.gd"
      - "tests/**/*.gd"
      - ".github/workflows/gdscript-style.yml"
  workflow_dispatch:

concurrency:
  group: gdscript-style-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin the formatter so local editors and CI agree. Bump deliberately.
  GDFORMAT_VERSION: "0.20.1"

jobs:
  style:
    name: "Format check + lint"
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install gdscript-formatter
        run: |
          base="https://github.com/GDQuest/GDScript-formatter/releases/download"
          asset="gdscript-formatter-${GDFORMAT_VERSION}-linux-x86_64"
          curl -sSL "${base}/${GDFORMAT_VERSION}/${asset}.zip" -o gdf.zip
          unzip -o gdf.zip -d gdf
          install -Dm755 "gdf/${asset}" "$HOME/.local/bin/gdscript-formatter"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Blocking. Run `scripts/gdformat` locally to fix.
      #
      # Two files are held out. The formatter reads a `#region` marker written
      # at column zero inside an indented `class` body as the end of that body
      # and re-indents everything after it to file scope, which silently lifts
      # `_PredictionEngine`'s static kernels out of their class. The result is
      # still valid GDScript, so `--check-only` and even the formatter's own
      # `--safe` mode pass it, and the damage only surfaces as runtime
      # "Nonexistent function" cascades. The markers cannot simply be indented
      # either: tests/unit/sim/test_predict_kernel_purity.gd locates that fence
      # at column zero to lint the kernels, so the placement is load-bearing.
      - name: Check formatting
        run: scripts/gdformat --check

      # Advisory. private-access and signal-name conflict with Networked's
      # internal-access and private-signal conventions.
      - name: Lint
        continue-on-error: true
        run: |
          gdscript-formatter lint --pretty \
            --max-line-length 100 \
            --disable private-access,signal-name \
            addons/networked tests
