name: Build native library
description: >
  Build one declared library cell with ci/build.py and stage its exact
  outputs. Every workflow that needs a library either runs this or downloads
  what a job that ran it produced.

inputs:
  cell:
    description: Cell id, platform:slice:target, as ci/matrix.py resolves it.
    required: false
    default: ""
  profile:
    description: Profile to build instead of a single cell.
    required: false
    default: ""
  platform:
    description: Platform of the cell, used for toolchain setup only.
    required: false
    default: ""
  suffix:
    description: The cell's library suffix, which identifies the caches.
    required: false
    default: ""
  scons-args:
    description: Extra key=value arguments passed through to SCons.
    required: false
    default: ""
  strip:
    description: Strip the outputs with this platform's own toolchain.
    required: false
    default: "false"
  require-fresh:
    description: Refuse an output this run did not write, which a release candidate must.
    required: false
    default: "false"
  staging:
    description: Directory the cell stages into.
    required: false
    default: dist/cells
  python-version:
    description: Python that runs SCons.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Read Dependency Pins
      id: pins
      shell: bash
      run: |
        set -eu
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import sys

        sys.path.insert(0, "ci")
        from common import read_pins

        for key, value in read_pins().items():
            print("%s=%s" % (key, value))
        PY

    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install SCons
      shell: bash
      run: pip install "scons==${{ steps.pins.outputs.SCONS_VERSION }}"

    - name: Set Up Emscripten
      if: inputs.platform == 'web'
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: ${{ steps.pins.outputs.EM_VERSION }}

    - name: Install The Pinned Android NDK
      if: inputs.platform == 'android'
      shell: bash
      env:
        NDK_VERSION: ${{ steps.pins.outputs.ANDROID_NDK_VERSION }}
      run: |
        set -eu
        root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        test -n "$root"
        echo "sdk root $root, already holding:"
        ls "$root/ndk" || echo "  (no ndk directory)"
        ndk="$root/ndk/$NDK_VERSION"
        if [ ! -d "$ndk/toolchains/llvm/prebuilt" ]; then
          tool="$(command -v sdkmanager || true)"
          if [ -z "$tool" ]; then
            tool="$(find "$root/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -n "$tool"
          echo "installing ndk;$NDK_VERSION with $tool"
          yes | "$tool" --install "ndk;$NDK_VERSION"
        fi
        test -d "$ndk/toolchains/llvm/prebuilt"
        echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

    - name: Cache Native Dependencies
      uses: actions/cache@v4
      with:
        path: extension/thirdparty
        key: >-
          extension-thirdparty-${{ runner.os }}-${{ inputs.suffix }}-${{
            hashFiles('extension/deps.env') }}-${{
            hashFiles('ci/platforms.json') }}

    - name: Cache SCons Objects
      uses: actions/cache@v4
      with:
        path: .scons_cache
        key: >-
          scons-cache-${{ runner.os }}-${{ inputs.suffix }}-${{
            inputs.scons-args }}-${{ hashFiles('extension/deps.env') }}-${{
            github.sha }}
        restore-keys: >-
          scons-cache-${{ runner.os }}-${{ inputs.suffix }}-${{
            inputs.scons-args }}-${{ hashFiles('extension/deps.env') }}-

    - name: Build The Cell
      shell: bash
      env:
        SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        NETW_CELL: ${{ inputs.cell }}
        NETW_PROFILE: ${{ inputs.profile }}
        NETW_STAGING: ${{ inputs.staging }}
        NETW_STRIP: ${{ inputs.strip }}
        NETW_FRESH: ${{ inputs.require-fresh }}
        NETW_SCONS_ARGS: ${{ inputs.scons-args }}
      run: |
        set -eu
        args=(python3 ci/build.py --staging "$NETW_STAGING")
        if [ -n "$NETW_CELL" ]; then
          args+=(--cell "$NETW_CELL")
        else
          args+=(--profile "$NETW_PROFILE")
        fi
        if [ "$NETW_STRIP" = "true" ]; then
          args+=(--strip)
        fi
        if [ "$NETW_FRESH" = "true" ]; then
          args+=(--require-fresh)
        fi
        for extra in $NETW_SCONS_ARGS; do
          args+=(--scons-arg "$extra")
        done
        "${args[@]}"
