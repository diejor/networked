name: Build native library
description: >
  Build one GDExtension cell with SCons at the extension/deps.env pins and
  deploy it into addons/networked/bin. Every workflow that needs a library
  either runs this or downloads what a job that ran it produced.

inputs:
  platform:
    description: >
      godot-cpp platform name. Empty builds for the host, which is what a
      contributor gets from a bare `scons`.
    required: false
    default: ""
  target:
    description: godot-cpp target (template_debug, template_release, editor).
    required: false
    default: template_debug
  arch:
    description: godot-cpp arch. Empty lets godot-cpp detect the host arch.
    required: false
    default: ""
  scons-flags:
    description: Extra `key=value` arguments appended to the SCons line.
    required: false
    default: ""
  python-version:
    description: Python that runs SCons.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    # deps.env is the only place a version is declared, so every pin this
    # action needs is read out of it rather than repeated here.
    - name: Read Dependency Pins
      id: pins
      shell: bash
      run: cat extension/deps.env >> "$GITHUB_OUTPUT"

    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install SCons
      shell: bash
      run: pip install "scons==${{ steps.pins.outputs.SCONS_VERSION }}"

    # A side module built by a different emscripten than the one that built
    # the engine's export template does not load in the browser, so EM_VERSION
    # in deps.env is the version Godot's own web_builds.yml pins for the
    # engine releases this addon targets. Changing one without the other is
    # the bug this comment exists to prevent.
    - name: Set Up Emscripten
      if: inputs.platform == 'web'
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: ${{ steps.pins.outputs.EM_VERSION }}

    # godot-cpp and Tracy are fetched into extension/thirdparty at the pinned
    # refs on first build, and godot-cpp's generated bindings and static
    # library land beside them. Those are per-cell, so the key carries the
    # cell as well as the pins.
    - name: Cache Native Dependencies
      uses: actions/cache@v4
      with:
        path: extension/thirdparty
        key: >-
          extension-thirdparty-${{ runner.os }}-${{ inputs.platform }}-${{
            inputs.arch }}-${{ inputs.target }}-${{
            hashFiles('extension/deps.env') }}

    # Object files for the extension's own sources. SCONS_CACHE is read by
    # godot-cpp's SConstruct, which this build calls into.
    - name: Cache SCons Objects
      uses: actions/cache@v4
      with:
        path: .scons_cache
        key: >-
          scons-cache-${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch
            }}-${{ inputs.target }}-${{ hashFiles('extension/deps.env') }}-${{
            github.sha }}
        restore-keys: >-
          scons-cache-${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch
            }}-${{ inputs.target }}-${{ hashFiles('extension/deps.env') }}-

    - name: Build Native Library
      shell: bash
      env:
        SCONS_CACHE: ${{ github.workspace }}/.scons_cache
      run: |
        set -eu
        jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
        args="target=${{ inputs.target }}"
        if [ -n "${{ inputs.platform }}" ]; then
          args="$args platform=${{ inputs.platform }}"
        fi
        if [ -n "${{ inputs.arch }}" ]; then
          args="$args arch=${{ inputs.arch }}"
        fi
        echo "scons -C extension -j$jobs $args ${{ inputs.scons-flags }}"
        # shellcheck disable=SC2086
        scons -C extension -j"$jobs" $args ${{ inputs.scons-flags }}

    # A build that produces no library still exits zero if SCons decided
    # everything was up to date against a poisoned cache, so the deploy
    # directory is checked rather than assumed.
    - name: Verify Deployed Library
      shell: bash
      run: |
        set -eu
        ls -l addons/networked/bin
        count="$(find addons/networked/bin \
          -name 'libnetworked*' -print | wc -l)"
        if [ "$count" -eq 0 ]; then
          echo "::error::no library was deployed into addons/networked/bin"
          exit 1
        fi
