name: Build docs classes
description: >
  Build the native library, install the engine named in the catalog, and run
  docs/tools/build_reference.py. A thin adapter over the same script the
  Makefile and Read the Docs call.

inputs:
  engine:
    description: Entry in ci/engines.json to install.
    required: false
    default: normal
  python-version:
    description: Python version for Sphinx.
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: docs/requirements.txt

    - name: Install Python dependencies
      shell: bash
      working-directory: docs
      run: pip install -r requirements.txt

    - uses: ./.github/actions/build-native
      with:
        cell: linux:x86_64:template_debug
        platform: linux
        suffix: .linux.template_debug.x86_64
        python-version: ${{ inputs.python-version }}

    - name: Cache Godot binary
      uses: actions/cache@v4
      with:
        path: .engines
        key: engine-${{ inputs.engine }}-${{ hashFiles('ci/engines.json') }}

    - name: Install The Engine
      id: engine
      shell: bash
      run: python3 ci/engine.py --engine ${{ inputs.engine }} install

    - name: Generate The Class Reference
      shell: bash
      run: python3 docs/tools/build_reference.py --godot "${{ steps.engine.outputs.binary }}"
