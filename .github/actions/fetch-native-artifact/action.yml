name: Fetch native artifact
description: >
  Download staged cells and deploy the named ones into addons/networked/bin.
  Each artifact lands in a directory of its own, and ci/package.py checks the
  build record before anything reaches the addon, so a job cannot run against
  a library from another revision or another cell.

inputs:
  cells:
    description: Comma-separated cell ids to deploy.
    required: true
  pattern:
    description: Artifact name pattern to download.
    required: false
    default: native-*
  run-id:
    description: >
      Workflow run that uploaded the artifacts. Empty means the current run.
      A cross-run fetch needs `actions: read` and a token.
    required: false
    default: ""
  github-token:
    description: Token used only for a cross-run fetch.
    required: false
    default: ""
  expect-sha:
    description: Revision the cells must have been built at.
    required: false
    default: ""
  staging:
    description: Directory the artifacts download into.
    required: false
    default: dist/cells

runs:
  using: composite
  steps:
    - name: Download Staged Cells
      if: inputs.run-id == ''
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.staging }}

    - name: Download Staged Cells (cross-run)
      if: inputs.run-id != ''
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.staging }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Deploy The Requested Cells
      shell: bash
      env:
        NETW_CELLS: ${{ inputs.cells }}
        NETW_STAGING: ${{ inputs.staging }}
        NETW_SHA: ${{ inputs.expect-sha }}
      run: |
        set -eu
        args=(python3 ci/package.py --cells "$NETW_CELLS"
              --staging "$NETW_STAGING"
              --deploy-into addons/networked/bin)
        if [ -n "$NETW_SHA" ]; then
          args+=(--expect-sha "$NETW_SHA")
        fi
        "${args[@]}"
        ls -l addons/networked/bin
